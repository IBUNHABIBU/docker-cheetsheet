sudo: required
services:
  -docker

before_install:
  - docker build -t ibunhabibu/frontend -f Dockerfile.dev .

sript:
  - doker run ibunhabibu/frontend npm run test -- --coverage

deploy: 
    provider: elastic beanstalk
    region: "us-west-2"
    app: "frontend"
    env: "docker env"
    bucket_name: "elastic-beanstalk-us-weast-830813344498994"
    bucket-path: "frontend"
    on: 
      branch: master
